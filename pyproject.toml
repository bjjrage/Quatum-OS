[project]
name = "trading-os"
version = "0.1.0"
description = "Trading / Quant OS - High-Performance Market Data Foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
